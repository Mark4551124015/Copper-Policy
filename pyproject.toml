[project]
name = "copper-policy"
version = "0.1.0"
requires-python = "==3.10.16"
# Pinned checkpoint inference environment; simulator packages are installed separately.
dependencies = [
    # --- torch stack (CUDA 13.0 wheels from the pytorch-cu130 index) ---
    "torch==2.9.0+cu130",
    "torchvision==0.24.0+cu130",
    "torchaudio==2.9.0+cu130",
    "einops==0.8.2",
    "numpy==1.26.4",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.8",
    "packaging==26.0",
    # --- diffusion / transformer model ---
    "diffusers==0.36.0",
    "transformers==4.55.2",
    "tokenizers==0.21.4",
    "timm==1.0.26",
    "safetensors==0.7.0",
    "accelerate==1.13.0",
    "sentencepiece==0.2.1",
    "ftfy==6.3.1",
    "pillow==11.3.0",
    "tqdm==4.67.3",
    # --- retained dependencies from the validated checkpoint environment ---
    "opencv-python-headless==4.11.0.86",
    # --- real-robot websocket deployment ---
    "msgpack==1.1.2",
    "websockets==16.0",
    # --- misc ---
    "easydict==1.13",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
libero = [
    "robosuite==1.4.1",
    # LIBERO-Plus sensor perturbations import these at environment startup.
    "wand==0.7.1",
    "scikit-image>=0.24,<0.26",
    "mujoco==3.3.2",
    "bddl==3.6.0",
    "gym==0.26.2",
    "numba==0.65.0",
    "imageio-ffmpeg==0.6.0",
    "cloudpickle==3.1.2",
    "h5py==3.16.0",
    "matplotlib",
    "termcolor",
]
robotwin = [
    "sapien==3.0.0b1",
    "mplib==0.2.1",
    "gymnasium==0.29.1",
    "transforms3d==0.4.2",
    "trimesh==4.4.3",
    "open3d==0.18.0",
    "toppra==0.6.8",
    "imageio==2.37.3",
    "h5py==3.16.0",
    "pyglet<2",
    "termcolor",
    # cuRobo runtime and build dependencies; its CUDA extensions are built
    # separately with tools/setup_robotwin.sh against this locked PyTorch.
    "warp-lang==1.12.0",
    "numpy-quaternion",
    "yourdfpy>=0.0.53",
    "pybind11",
    "setuptools==81.0.0",
    "setuptools-scm>=6.2",
    "wheel",
    "ninja",
    "scikit-image",
    "importlib-resources",
]

# The lock targets Linux x86_64 and CUDA 13.0 wheels.
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv]
package = false
# Linux x86_64 CUDA environment.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Match the package versions used for the existing checkpoints.
override-dependencies = [
    "torch==2.9.0+cu130",
    "torchvision==0.24.0+cu130",
]

# Pin shared direct and transitive dependencies to the reference evaluation environment.
